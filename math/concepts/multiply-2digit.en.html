const $ = s => document.querySelector(s);
const wait = ms => matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms;
document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = S[e.dataset.t]);
$('#back').textContent = S.back;
$(LANG === 'zh' ? '#tozh' : '#toen').classList.add('on');
for (const a of ['#tozh', '#toen']) $(a).addEventListener('click', () => { try { localStorage.setItem('lang', a === '#tozh' ? 'zh' : 'en'); } catch (e) {} });

/* discs: colours as in the book (1 grey, 10 red, 100 orange) */
const DISC = { 1000: ['#3a9d5d', '#fff'], 100: ['#e8912b', '#fff'], 10: ['#d94141', '#fff'], 1: ['#e6e9e9', '#33403f'] };
function disc(x, y, r, v, cls, col) {
  const [f, t] = DISC[v];
  return `<g class="disc ${cls || ''}" data-c="${col}"><circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>` +
    `<text x="${x}" y="${y + r * 0.34}" text-anchor="middle" style="fill:${t};font-size:${v >= 100 ? r * 0.72 : r * 0.9}px;font-weight:600">${v}</text></g>`;
}

/* ---------- Part A: ×10 and ×k with a place-value chart ---------- */
const VAL = [100, 10, 1], CW = 200, CX0 = 20, PER = 3, SP = 60, R = 27, ONES = 2;
const PA = [[34, 2], [23, 3], [41, 2], [12, 4], [24, 3], [32, 3]];
const toCols = v => VAL.map(p => Math.floor(v / p) % 10);
const colsVal = c => c.reduce((s, n, i) => s + n * VAL[i], 0);
let A, busyA = false;
function needRegroup() { for (let i = ONES; i > 0; i--) if (A.cols[i] >= 10) return i; return -1; }
function startA(i) { const [a, k] = PA[i]; A = { i, a, k, cols: toCols(a), ten: false, mul: false, vals: [a], ops: [], shown: 0, born: null }; renderA(); }
$('#presetsA').innerHTML = PA.map((p, i) => `<button data-i="${i}">${p[0]} × ${p[1] * 10}</button>`).join('');
$('#presetsA').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !busyA) startA(+b.dataset.i); });
$('#resetA').addEventListener('click', () => { if (!busyA) startA(A.i); });
$('#ten').addEventListener('click', () => {
  if (busyA || A.ten) return; busyA = true; renderA();
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('#pv .disc').forEach(g => g.style.transform = `translateX(-${CW}px)`)));
  setTimeout(() => { A.cols = [...A.cols.slice(1), 0]; A.ten = true; A.ops.push('× 10'); A.vals.push(colsVal(A.cols)); busyA = false; renderA(); }, wait(800));
});
$('#mul').addEventListener('click', () => {
  if (busyA || A.mul) return;
  A.born = [...A.cols]; A.cols = A.cols.map(n => n * A.k); A.mul = true; A.ops.push('× ' + A.k); A.vals.push(colsVal(A.cols)); renderA();
});
$('#regBtn').addEventListener('click', () => {
  const i = needRegroup(); if (busyA || i < 0) return; busyA = true; renderA();
  requestAnimationFrame(() => requestAnimationFrame(() => [...document.querySelectorAll(`#pv .disc[data-c="${i}"]`)].slice(0, 10).forEach(g => { g.style.transform = `translateX(-${CW / 2}px) scale(.3)`; g.style.opacity = 0; })));
  setTimeout(() => { A.born = [...A.cols]; A.cols[i] -= 10; A.cols[i - 1] += 1; busyA = false; renderA(); }, wait(750));
});
$('#revealA').addEventListener('click', () => { A.shown = A.vals.length - 1; renderA(); });

function renderA() {
  const reg = needRegroup(), cur = A.shown === A.vals.length - 1 && reg < 0;
  const zero = A.ten && A.cols[ONES] === 0 && cur;
  let s = '';
  for (let i = 0; i <= ONES; i++) {
    const x = CX0 + i * CW;
    if (i) s += `<line x1="${x}" y1="8" x2="${x}" y2="338" stroke="var(--line)" stroke-width="2"/>`;
    s += `<text x="${x + CW / 2}" y="36" text-anchor="middle" style="font-size:26px;font-weight:600;fill:var(--ink)">${S.places[i]}</text>`;
    if (i === ONES && zero) s += `<rect x="${x + 10}" y="50" width="${CW - 20}" height="236" rx="14" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-dasharray="8 6"/><text x="${x + CW / 2}" y="176" text-anchor="middle" style="fill:var(--red);font-size:28px">${S.empty}</text>`;
    const n = A.cols[i], per = n > 9 ? 4 : PER, sp = n > 9 ? 46 : SP, r = n > 9 ? 21 : R;
    const left = x + (CW - per * sp) / 2 + sp / 2;
    for (let j = 0; j < n; j++) {
      const isNew = A.born && j >= A.born[i];
      s += disc(left + (j % per) * sp, 84 + Math.floor(j / per) * sp, r, VAL[i], isNew ? 'pop' : '', i);
    }
  }
  /* digits under the chart, once the current number is revealed */
  if (cur) {
    const v = A.vals[A.vals.length - 1], first = VAL.findIndex(p => v >= p);
    for (let i = Math.max(first, 0); i <= ONES; i++) {
      const red = i === ONES && zero;
      s += `<text x="${CX0 + i * CW + CW / 2}" y="328" text-anchor="middle" style="font-size:44px;font-weight:600;fill:${red ? 'var(--red)' : 'var(--ink)'}">${A.cols[i]}</text>`;
    }
  }
  A.born = null;
  $('#pv').innerHTML = s; $('#pv').setAttribute('aria-label', A.vals.slice(0, A.shown + 1).join(' → '));

  let c = `<span>${A.a}</span>`;
  A.ops.forEach((op, j) => { c += `<span class="arr">${op}</span><span>${j + 1 <= A.shown ? fmt(A.vals[j + 1]) : '?'}</span>`; });
  $('#chainA').innerHTML = c;
  $('#mul').textContent = '× ' + A.k;
  const pend = A.shown < A.vals.length - 1;
  $('#ten').disabled = A.ten || busyA || reg >= 0 || pend; $('#mul').disabled = A.mul || busyA || reg >= 0 || pend;
  $('#regA').hidden = reg < 0 || busyA;
  if (reg >= 0) $('#regQ').textContent = S.regQ(S.placeNames[reg], A.cols[reg], S.placeNames[reg - 1]);
  $('#askA').hidden = !(A.shown < A.vals.length - 1 && reg < 0 && !busyA);
  $('#askMore').textContent = A.ten && A.mul ? '' : S.askMore;
  const done = A.ten && A.mul && cur;
  $('#resA').hidden = !(done || zero);
  if (done || zero) {
    const { a, k } = A, t = k * 10, tenFirst = A.ops[0] === '× 10';
    let r = '';
    if (zero) r += `<p>${S.zeroNote}</p>`;
    if (done) {
      r += `<p class="num" style="font-size:1.3rem">${a} × ${t} = ${tenFirst ? `${a} × 10 × ${k} = ${a * 10} × ${k}` : `${a} × ${k} × 10 = ${a * k} × 10`} = <b>${fmt(a * t)}</b></p>`;
      r += `<p>${S.m3(a, k)}</p>`;
    }
    $('#resA').innerHTML = r;
  }
}

/* ---------- Part B: a × b, b = tens + ones; rows of discs + the written algorithm ---------- */
const PB = [[24, 12], [21, 13], [45, 17], [32, 24], [58, 49]];
let B;
function startB(i) {
  const [a, b] = PB[i];
  B = { i, a, b, t: Math.floor(b / 10), o: b % 10, p1: a * (b % 10), p2: a * Math.floor(b / 10) * 10, step: 0, shown: false, pic: b < 20 };
  renderB();
}
$('#presetsB').innerHTML = PB.map((p, i) => `<button data-i="${i}">${p[0]} × ${p[1]}</button>`).join('');
$('#presetsB').addEventListener('click', e => { const b = e.target.closest('button'); if (b) startB(+b.dataset.i); });
$('#resetB').addEventListener('click', () => startB(B.i));
$('#nextB').addEventListener('click', () => { if (B.step < 4) { B.step++; renderB(); } });
$('#revealB').addEventListener('click', () => { B.shown = true; renderB(); });

function drawArray() {
  const ta = Math.floor(B.a / 10), oa = B.a % 10, r = 14, sp = 31, gap = 16, x0 = 104;
  const top = 12, yOf = row => top + row * sp + (row >= B.o ? gap : 0) + r;
  const H = yOf(B.b - 1) + r + 12, wRow = (ta + oa) * sp;
  const hiTop = B.step === 1 || B.step >= 4, hiBot = B.step === 2 || B.step === 3 || B.step >= 4;
  let s = '';
  const box = (r0, r1, on, fill) => `<rect x="${x0 - 8}" y="${yOf(r0) - r - 5}" width="${wRow + 16 - sp + 2 * r}" height="${yOf(r1) - yOf(r0) + 2 * r + 10}" rx="10" fill="${on ? fill : 'none'}" stroke="${on ? 'none' : 'var(--line)'}" stroke-dasharray="5 4"/>`;
  s += box(0, B.o - 1, hiTop, 'var(--soft-b)') + box(B.o, B.b - 1, hiBot, 'var(--soft-a)');
  for (let row = 0; row < B.b; row++) {
    for (let j = 0; j < ta + oa; j++) s += disc(x0 + j * sp + r - 2, yOf(row), r, j < ta ? 10 : 1, '', 0);
  }
  const lab = (r0, r1, txt, on, col) => `<text x="${x0 - 22}" y="${(yOf(r0) + yOf(r1)) / 2 + 6}" text-anchor="end" style="font-size:19px;font-weight:600;fill:${on ? col : 'var(--muted)'}">${txt}</text>`;
  s += lab(0, B.o - 1, `${B.a} × ${B.o}`, hiTop, 'var(--b)') + lab(B.o, B.b - 1, `${B.a} × 10`, hiBot, 'var(--a)');
  s += `<text x="${x0 + wRow + 10}" y="${(yOf(0) + yOf(B.b - 1)) / 2 + 6}" style="font-size:19px;font-weight:600;fill:var(--ink)">${B.a} × ${B.b}</text>`;
  return [`0 0 ${x0 + wRow + 92} ${H}`, s];
}
function renderB() {
  const { a, b, t, o, p1, p2, step } = B, sum = a * b;
  $('#arr').toggleAttribute('hidden', !B.pic); $('#noPic').hidden = B.pic;
  if (B.pic) { const [vb, s] = drawArray(); $('#arr').setAttribute('viewBox', vb); $('#arr').innerHTML = s; $('#arr').setAttribute('aria-label', `${b} rows of ${a}`); }
  else $('#noPic').textContent = S.noPic(b, t, o);

  /* the written algorithm, right-aligned in W columns plus a label column */
  const W = String(sum).length + 1;
  const row = (str, lbl, cls = []) => {
    const cells = Array(W).fill('&nbsp;'), cl = Array(W).fill('');
    [...str].reverse().forEach((ch, j) => { cells[W - 1 - j] = ch; cl[W - 1 - j] = cls[str.length - 1 - j] || ''; });
    return cells.map((ch, j) => `<span class="${cl[j]}">${ch}</span>`).join('') + `<span class="lbl">${lbl || ''}</span>`;
  };
  const line = `<div class="ln" style="grid-column:1 / span ${W}"></div><span></span>`;
  let h = row(String(a)) + row(String(b)).replace('<span class="">&nbsp;</span>', '<span>×</span>') + line;
  h += step >= 1 ? row(String(p1), `← ${a} × ${o}`) : row('');
  if (step >= 3) { const s2 = String(p2); h += row(s2, `← ${a} × ${t * 10}`, s2.split('').map((_, j) => j === s2.length - 1 ? 'red' : '')); }
  else if (step === 2) h += row('0', `← ${a} × ${t * 10}`, ['red']);
  else h += row('');
  h += step >= 4 ? line : `<div style="grid-column:1 / span ${W + 1};height:7px"></div>`;
  h += B.shown ? row(String(sum)) : row('');
  $('#vf').style.gridTemplateColumns = `repeat(${W}, auto) auto`;
  $('#vf').innerHTML = h;
  $('#vf').setAttribute('aria-label', `${a} × ${b}`);

  $('#capB').innerHTML = S.capB[step](B);
  $('#nextB').hidden = step >= 4;
  $('#askB').hidden = !(step >= 4 && !B.shown);
  $('#resB').hidden = !B.shown;
  if (B.shown) $('#resB').innerHTML = `<p class="num" style="font-size:1.2rem">${S.eqB(B)}</p>`;
}

$('#errs').innerHTML = S.errs.map(t => `<p class="err">${t}</p>`).join('');
