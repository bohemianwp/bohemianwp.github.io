/* place-value discs, colours as in the book */
const DISC = { 1000: ['#d9a521', '#fff'], 100: ['#e8912b', '#fff'], 10: ['#d94141', '#fff'], 1: ['#e6e9e9', '#33403f'] };
function disc(x, y, r, v, cls, col) {
  const [f, t] = DISC[v];
  return `<g class="disc ${cls || ''}" data-c="${col}"><circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>` +
    `<text x="${x}" y="${y + r * 0.34}" text-anchor="middle" style="fill:${t};font-size:${v >= 1000 ? r * 0.58 : v >= 100 ? r * 0.72 : r * 0.9}px;font-weight:600">${v >= 1000 ? '1,000' : v}</text></g>`;
}
/* n discs laid out from (cx, y0): in rows of rowLen (one row per group, dotted line between) or a plain grid */
let BOTTOM = 0;
function pile(cx, y0, n, v, col, rowLen, bornFrom, maxW) {
  const per = rowLen || (n <= 4 ? Math.max(n, 3) : 5), sp = Math.min(58, maxW / per), r = sp * 0.42;
  BOTTOM = Math.max(BOTTOM, y0 + Math.ceil(n / per) * sp);
  let s = '';
  const left = cx - (per * sp) / 2 + sp / 2;
  for (let j = 0; j < n; j++) {
    const row = Math.floor(j / per), x = left + (j % per) * sp, y = y0 + row * sp + r;
    s += disc(x, y, r, v, bornFrom != null && j >= bornFrom ? 'pop' : '', col);
  }
  if (rowLen) for (let row = 1; row * per < n; row++) { const y = y0 + row * sp - 1; s += `<line x1="${left - sp / 2}" y1="${y}" x2="${left + per * sp - sp / 2}" y2="${y}" stroke="var(--a)" stroke-dasharray="3 4" stroke-width="1.5"/>`; }
  return s;
}

    why: { zh: '5 个十 × 3 = 15 个十 = 150。', en: '5 tens × 3 = 15 tens = 150.' } },
  { q: { zh: '4 × 12 = 4 × 10 + 4 × ___', en: '4 × 12 = 4 × 10 + 4 × ___' }, ch: ['2', '12', '10'], k: 0,
    hint: { zh: '12 切成 10 和几？', en: '12 is cut into 10 and what?' },
    why: { zh: '12 = 10 + 2，切成两块：4 × 10 和 4 × 2。', en: '12 = 10 + 2, so the two parts are 4 × 10 and 4 × 2.' } },
  { q: { zh: '32 × 3 = 30 × 3 + 2 × 3 = ?', en: '32 × 3 = 30 × 3 + 2 × 3 = ?' }, ch: ['96', '66', '36'], k: 0,

    hint: { zh: '10 个一换 1 个十。', en: '10 ones make 1 ten.' },

    hint: { zh: '这个十是从哪来的？', en: 'Where did that ten come from?' },

    hint: { zh: '12 个十，10 个十换 1 个百。', en: '12 tens: 10 tens make 1 hundred.' },

const T = c => typeof c === 'string' ? c : c[LANG];
const done = new Map();
$('#quiz').innerHTML = QZ.map((x, i) => `<div class="q" data-i="${i}"><p><b class="num">${i + 1}.</b> ${x.q[LANG]}</p><div class="btns">${x.ch.map((c, j) => `<button class="num" data-j="${j}">${T(c)}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('');
$('#score').textContent = `0 / ${QZ.length}`;
$('#quiz').addEventListener('click', e => {
  const b = e.target.closest('button[data-j]'); if (!b) return;
  const box = b.closest('.q'), i = +box.dataset.i, x = QZ[i], ok = +b.dataset.j === x.k;
  if (!done.has(i)) done.set(i, ok);

  $('#score').textContent = `${right} / ${QZ.length}`;
  if (right >= QZ.length - 1) { try { localStorage.setItem('star:' + ID, '1'); } catch (e) {} renderLog(); }
