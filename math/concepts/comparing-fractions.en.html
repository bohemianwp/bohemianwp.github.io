<html lang="en">
<head>

<title>Comparing Fractions</title>

<link rel="stylesheet" href="../../assets/site.css">
<style>
/* One column like a workbook: play with two fraction bars first, then the four ways, then mistakes and a quiz. */
.wrap{display:flex;flex-direction:column;gap:24px}
h1{font-size:clamp(2rem,7vw,3rem)}
h2{font-size:1.5rem}
p{margin:0}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:flex;flex-direction:column;gap:12px;padding-top:6px}
header .lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
section{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px clamp(16px,4vw,26px);display:flex;flex-direction:column;gap:14px}
.why{border-left:4px solid var(--both);padding:2px 0 2px 14px}
.why b{color:var(--both)}
.ca{color:var(--a)} .cb{color:var(--b)} .cboth{color:var(--both)}
.num{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;margin:0 .12em;font-size:.95em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.pick{display:flex;align-items:center;gap:8px;font-weight:700}
.pick .stack{display:inline-flex;flex-direction:column;gap:4px}
select{font:inherit;font-family:"Fredoka",system-ui,sans-serif;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 16px}
button:hover{border-color:var(--a)}
button.on,button.primary{background:var(--a);color:var(--paper);border-color:var(--a)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.presets button{padding:4px 12px}
svg{display:block;width:100%;height:auto}
svg text{font-family:"Fredoka",system-ui,sans-serif;fill:var(--muted);font-size:14px}
.pa{fill:var(--a)} .pb{fill:var(--b)} .pe{fill:var(--bg)}
.edge{fill:none;stroke:var(--ink);stroke-width:1.2}
.half{stroke:var(--both);stroke-width:2;stroke-dasharray:5 4}
text.hl{fill:var(--both);font-weight:600}
.result{background:var(--soft-both);border-radius:12px;padding:12px 14px;font-size:1.05rem}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;opacity:.55;transition:opacity .2s,border-color .2s}
.m.yes{opacity:1;border-color:var(--both)}
.m h3{font-size:1.05rem}
.m .st{font-size:.9rem;font-weight:700;color:var(--muted)}
.m.yes .st{color:var(--both)}
@media (max-width:560px){.methods{grid-template-columns:1fr}}
.steps{display:grid;gap:10px}
.step{border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.step h3{font-size:1.05rem;margin-bottom:4px}
.order{background:var(--soft-a);border-radius:12px;padding:12px 14px}
.err{border-left:4px solid var(--b);padding:2px 0 2px 14px}
.err b{color:var(--b)}
.quiz{display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.q .btns{display:flex;gap:8px;flex-wrap:wrap}
.q .btns button{min-width:3em}
.fb{border-radius:10px;padding:8px 12px}
.fb.ok{background:var(--soft-both)} .fb.no{background:var(--soft-b)}
.note{color:var(--muted);font-size:.92rem}
ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
footer{color:var(--muted);font-size:.9rem}
</style>
</head>

  <a id="back" href="../index.html?lang=en"></a>

<div class="wrap">
<header>

<script>
const LANG = document.documentElement.lang === 'en' ? 'en' : 'zh';
const ID = 'comparing-fractions';
/* {a/b} in any string becomes a stacked fraction */
const S = {
zh: {

  oneLine: '一句话：<b>比较分数（compare fractions）</b>，就是看在<b>同一个整体</b>里，谁占得多。',
  whyEye: '为什么要学',
  whyText: '分披萨、看进度条（下载了 {3/4} 还是 {2/3}？）、量木料（{5/8} 英寸和 {3/4} 英寸哪个厚？）都要比分数。后面学分数加减、小数、百分数，都从这里开始。',
  playEye: '动手 · 两条分数条',
  playH: '先比一比，再看能用哪种方法',
  fa: '分数 A', fb: '分数 B',
  cut: '切成一样大的小块（通分）',
  pickNote: '上面一格选分子（取几份），下面一格选分母（平均分成几份）。绿色虚线是一半。',
  tryThese: '试试这几组：',
  playWhy: '为什么这样想：<b>分母管「每份多大」，分子管「有几份」</b>。两样里有一样相同，就只比另一样；都不同，就先把它们切成一样大的小块。',
  bigger: (A, B) => `<b>${A}</b> 更大`,
  equal: '一样大',
  res: (a, b, word, sym) => `A = ${a}，B = ${b}：${word}（${a} ${sym} ${b}）`,
  m: [
    ['① 分母相同，比分子', '每一份一样大，份数多的就大。'],
    ['② 分子相同，比分母', '份数一样多，分母越大，每份越小。'],
    ['③ 跟 {1/2} 比', '一个比一半多、一个比一半少，马上分出来。'],
    ['④ 通分：变成同分母', '找两个分母的公倍数，都换成一样大的小块，再比分子。哪组都能用，就是最费事。']
  ],
  yes: '这组能用 ✓', no: '这组用不上',
  conv: (a, b) => `这组：A = ${a}，B = ${b}`,
  exEye: '例题 · 一步一步',
  exH: '四种方法，各来一道',
  steps: [
    ['① {5/8} 和 {3/8}', '分母都是 8，每份都是 {1/8}。5 份比 3 份多，所以 <b>{5/8} &gt; {3/8}</b>。'],
    ['② {3/5} 和 {3/8}', '都取 3 份。分成 5 份，每份比分成 8 份的大（{1/5} &gt; {1/8}），所以 <b>{3/5} &gt; {3/8}</b>。'],
    ['③ {4/9} 和 {5/8}', '9 的一半是 4.5，4 比 4.5 小，所以 {4/9} 不到一半；8 的一半是 4，5 比 4 大，所以 {5/8} 超过一半。<b>{4/9} &lt; {5/8}</b>。'],
    ['④ {2/3} 和 {3/4}', '3 和 4 的最小公倍数是 12。{2/3} = {8/12}（上下都乘 4），{3/4} = {9/12}（上下都乘 3）。9 份比 8 份多，所以 <b>{2/3} &lt; {3/4}</b>。']
  ],
  order: '<b>先后顺序：</b>分母一样吗？→ 分子一样吗？→ 能不能跟一半比？→ 都不行，就通分。',
  bookNote: '⬜ 这四种方法的名字和顺序是按常见讲法整理的，以课本为准。',
  errEye: '常见错误',
  errH: '这几个坑，很多人踩过',
  errs: [
    '<b>「8 比 5 大，所以 {3/8} 比 {3/5} 大」✗</b> 分母大，说明切得碎，每一块反而小。',
    '<b>「3 比 2 大，所以 {3/5} 比 {2/3} 大」✗</b> 分母不一样时，只看分子不算数。通分：{3/5} = {9/15}，{2/3} = {10/15}，其实 {2/3} 更大。',
    '<b>通分只改分母：{2/3} → {2/12} ✗</b> 分母乘 4，分子也要乘 4，是 {8/12}。上下一起乘，大小才不变。',
    '<b>整体不一样大，不能直接比 ✗</b> 大披萨的 {1/3} 可能比小披萨的 {1/2} 还多。比较分数，说的都是同一个整体。'
  ],
  quizEye: '小测验', quizH: '先比，再说为什么', score: '答对：',
  mq: '最快用哪种方法？',
  mchoices: ['① 分母相同', '② 分子相同', '③ 跟一半比', '④ 通分'],
  right: '对了！', again: '再想想：',
  sayEye: '用你自己的话说一说',
  say: '为什么 {1/8} 比 {1/5} 小，可 8 明明比 5 大？拿一张纸折一折，讲给爸爸听。',
  relEye: '相关概念',
  rel: ['<a href="factors-multiples.zh.html">公因数与公倍数</a>：通分要找两个分母的<b>公倍数</b>', '等值分数（equivalent fractions）：本章第 1 课，上下同乘一个数，大小不变（页面还没做）'],
  logEye: '学习记录',
  log: ['2026-11-01 · 4A 第 6 章 第 2 课 · 比较分数的四种方法'],
  star: '小测验已得 ★',
  parentEye: '写给爸爸妈妈',
  parent: ['先让孩子随便拖两组分数，<b>说出谁大、为什么</b>，再看下面亮起的方法。', '做错时别急着讲，问一句：「每一份一样大吗？份数一样多吗？」', '拿真东西：一张纸对折几次、一块饼切几刀，比画图记得牢。'],
  foot: '学校里常见的英文：fraction 分数 · numerator 分子 · denominator 分母 · common denominator 公分母 · equivalent fractions 等值分数 · benchmark 参照数（如 1/2）· greater than / less than 大于 / 小于。'
},
en: {
  back: '← Contents',
  eyebrow: '4A Chapter 6 · Fractions · Lesson 2 · 比较分数',
  h1: 'Which fraction is bigger?',
  lead: 'A fraction means "split one whole into equal parts and take some of them." To compare, ask two things: <b>how big is each part</b> (the denominator 分母) and <b>how many parts</b> (the numerator 分子).',
  oneLine: 'In one line: <b>comparing fractions (比较分数)</b> means seeing which one takes up more of <b>the same whole</b>.',
  whyEye: 'Why learn this',
  whyText: 'Sharing pizza, reading a progress bar ({3/4} or {2/3} downloaded?), measuring wood (is {5/8} inch or {3/4} inch thicker?) all mean comparing fractions. Adding fractions, decimals and percents all start here.',
  playEye: 'Hands-on · two fraction bars',
  playH: 'Compare first, then see which way works',
  fa: 'Fraction A', fb: 'Fraction B',
  cut: 'Cut into same-size pieces (common denominator)',
  pickNote: 'Top box: the numerator (how many parts you take). Bottom box: the denominator (how many equal parts). The green dashed line is one half.',
  tryThese: 'Try these:',
  playWhy: 'Why it works: <b>the denominator tells the size of each part; the numerator tells how many parts</b>. If one of them is the same, compare only the other. If both differ, first cut them into same-size pieces.',
  bigger: (A, B) => `<b>${A}</b> is bigger`,
  equal: 'they are equal',
  res: (a, b, word, sym) => `A = ${a}, B = ${b}: ${word} (${a} ${sym} ${b})`,
  m: [
    ['① Same denominator: compare numerators', 'Every part is the same size, so more parts means bigger.'],
    ['② Same numerator: compare denominators', 'Same number of parts. A bigger denominator means smaller parts.'],
    ['③ Compare with {1/2}', 'If one is more than half and the other is less, you are done.'],
    ['④ Common denominator', 'Find a common multiple of the denominators, rewrite both with same-size pieces, then compare numerators. Always works, just more steps.']
  ],
  yes: 'Works here ✓', no: 'Not for this pair',
  conv: (a, b) => `Here: A = ${a}, B = ${b}`,
  exEye: 'Worked examples · step by step',
  exH: 'One example for each way',
  steps: [
    ['① {5/8} and {3/8}', 'Both denominators are 8, so every part is {1/8}. 5 parts are more than 3 parts, so <b>{5/8} &gt; {3/8}</b>.'],
    ['② {3/5} and {3/8}', 'Both take 3 parts. Fifths are bigger than eighths ({1/5} &gt; {1/8}), so <b>{3/5} &gt; {3/8}</b>.'],
    ['③ {4/9} and {5/8}', 'Half of 9 is 4.5, and 4 is less, so {4/9} is less than half. Half of 8 is 4, and 5 is more, so {5/8} is more than half. <b>{4/9} &lt; {5/8}</b>.'],
    ['④ {2/3} and {3/4}', 'The least common multiple of 3 and 4 is 12. {2/3} = {8/12} (×4 top and bottom), {3/4} = {9/12} (×3 top and bottom). 9 parts beat 8 parts, so <b>{2/3} &lt; {3/4}</b>.']
  ],
  order: '<b>Order to try:</b> Same denominator? → Same numerator? → Can you compare with one half? → If not, find a common denominator.',
  bookNote: '⬜ The names and order of these four ways follow common teaching; check the textbook for its exact wording.',
  errEye: 'Common mistakes',
  errH: 'Traps many people fall into',
  errs: [
    '<b>"8 is bigger than 5, so {3/8} is bigger than {3/5}" ✗</b> A bigger denominator means the whole is cut finer, so each part is smaller.',
    '<b>"3 is bigger than 2, so {3/5} is bigger than {2/3}" ✗</b> When denominators differ, numerators alone tell you nothing. {3/5} = {9/15} and {2/3} = {10/15}, so {2/3} is bigger.',
    '<b>Changing only the denominator: {2/3} → {2/12} ✗</b> If you multiply the bottom by 4, multiply the top by 4 too: {8/12}. Same factor on both, same size.',
    '<b>Different-size wholes ✗</b> {1/3} of a large pizza can be more than {1/2} of a small one. Comparing fractions always means the same whole.'
  ],
  quizEye: 'Quiz', quizH: 'Compare, then say why', score: 'Correct:',
  mq: 'Which way is fastest?',
  mchoices: ['① Same denominator', '② Same numerator', '③ Compare with half', '④ Common denominator'],
  right: 'Right! ', again: 'Think again: ',
  sayEye: 'Say it in your own words',
  say: 'Why is {1/8} smaller than {1/5}, even though 8 is bigger than 5? Fold a sheet of paper and explain it to Dad.',
  relEye: 'Related concepts',
  rel: ['<a href="factors-multiples.en.html">Common factors and common multiples</a>: a common denominator is a <b>common multiple</b> of the denominators', 'Equivalent fractions (等值分数): Lesson 1 of this chapter. Multiply top and bottom by the same number and the size stays the same (page not made yet)'],
  logEye: 'Learning log',
  log: ['2026-11-01 · 4A Chapter 6 Lesson 2 · Four ways to compare fractions'],
  star: 'Quiz star earned ★',
  parentEye: 'For parents',
  parent: ['Let your child try a few pairs first and <b>say which is bigger and why</b>, then look at which way lights up.', 'When an answer is wrong, ask: "Are the parts the same size? Is the number of parts the same?"', 'Use real things: fold paper, cut a pancake. Hands remember longer than pictures.'],
  foot: 'Words used at school: fraction 分数 · numerator 分子 · denominator 分母 · common denominator 公分母 · equivalent fractions 等值分数 · benchmark 参照数 (like 1/2) · greater than / less than 大于 / 小于.'
}}[LANG];

const $ = s => document.querySelector(s);
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const F = s => s.replace(/\{(\d+)\/(\d+)\}/g, (_, n, d) => fr(n, d));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;

document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = F(S[e.dataset.t]));
$('#back').textContent = S.back;
$(LANG === 'zh' ? '#tozh' : '#toen').classList.add('on');
for (const a of ['#tozh', '#toen']) $(a).addEventListener('click', () => { try { localStorage.setItem('lang', a === '#tozh' ? 'zh' : 'en'); } catch (e) {} });

/* bars */
let cut = false;
function fillNum(sel, d, keep) {
  sel.innerHTML = '';
  for (let i = 0; i <= d; i++) sel.append(new Option(i, i));
  sel.value = Math.min(keep, d);
}
for (const id of ['#da', '#db']) for (let d = 1; d <= 12; d++) $(id).append(new Option(d, d));
function setPair(na, da, nb, db) {
  $('#da').value = da; $('#db').value = db;
  fillNum($('#na'), da, na); fillNum($('#nb'), db, nb);
  render();
}
function bar(y, n, d, k, cls, label) {
  const x0 = 60, W = 560, H = 46, pieces = d * k, w = W / pieces;
  let s = `<text x="0" y="${y + 29}" class="${cls === 'pa' ? 'ca' : 'cb'}" style="fill:var(--${cls === 'pa' ? 'a' : 'b'});font-weight:600">${label}</text>`;
  for (let i = 0; i < pieces; i++) s += `<rect x="${x0 + i * w}" y="${y}" width="${w}" height="${H}" class="${i < n * k ? cls : 'pe'}" stroke="var(--ink)" stroke-width="1"/>`;
  return s;
}
function render() {
  const na = +$('#na').value, da = +$('#da').value, nb = +$('#nb').value, db = +$('#db').value;
  const L = lcm(da, db), ka = cut ? L / da : 1, kb = cut ? L / db : 1;
  const fa = cut ? `${na * ka}/${L}` : `${na}/${da}`, fb2 = cut ? `${nb * kb}/${L}` : `${nb}/${db}`;
  let s = bar(24, na, da, ka, 'pa', 'A') + bar(104, nb, db, kb, 'pb', 'B');
  s += `<line x1="340" y1="10" x2="340" y2="160" class="half"/><text x="340" y="182" text-anchor="middle" class="hl">1/2</text>`;
  s += `<text x="60" y="182">0</text><text x="620" y="182" text-anchor="end">1</text>`;
  $('#bars').innerHTML = s;
  $('#bars').setAttribute('aria-label', `A ${fa}, B ${fb2}`);
  const c = na * db - nb * da;
  const A = fr(na, da), B = fr(nb, db);
  const word = c > 0 ? S.bigger('A', 'B') : c < 0 ? S.bigger('B', 'A') : `<b>${S.equal}</b>`;
  $('#result').innerHTML = S.res(A, B, word, c > 0 ? '&gt;' : c < 0 ? '&lt;' : '=');
  const sideA = Math.sign(2 * na - da), sideB = Math.sign(2 * nb - db);
  const ok = [da === db, na === nb && na > 0, sideA !== sideB, true];
  $('#methods').innerHTML = S.m.map(([h, t], i) => `<div class="m${ok[i] ? ' yes' : ''}"><h3>${F(h)}</h3><p>${F(t)}</p>` +
    (i === 3 ? `<p class="note">${S.conv(fr(na * L / da, L), fr(nb * L / db, L))}</p>` : '') +
    `<span class="st">${ok[i] ? S.yes : S.no}</span></div>`).join('');
  $('#cut').classList.toggle('on', cut);
}
for (const id of ['#da', '#db']) $(id).addEventListener('change', () => { const n = id === '#da' ? '#na' : '#nb'; fillNum($(n), +$(id).value, +$(n).value); render(); });
for (const id of ['#na', '#nb']) $(id).addEventListener('change', render);
$('#cut').addEventListener('click', () => { cut = !cut; render(); });
const PRE = [[5, 8, 3, 8], [3, 5, 3, 8], [4, 9, 5, 8], [2, 3, 3, 4], [6, 8, 3, 4]];
$('#presets').innerHTML = PRE.map((p, i) => `<button data-i="${i}">${fr(p[0], p[1])} · ${fr(p[2], p[3])}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const p = PRE[+b.dataset.i]; setPair(...p); });

/* examples, mistakes, lists */
$('#steps').innerHTML = S.steps.map(([h, t]) => `<div class="step"><h3>${F(h)}</h3><p>${F(t)}</p></div>`).join('');
$('#errs').innerHTML = S.errs.map(t => `<p class="err">${F(t)}</p>`).join('');
$('#rel').innerHTML = S.rel.map(t => `<li>${F(t)}</li>`).join('');
$('#parent').innerHTML = S.parent.map(t => `<li>${F(t)}</li>`).join('');
function renderLog() {
  let st = false; try { st = !!localStorage.getItem('star:' + ID); } catch (e) {}
  $('#log').innerHTML = S.log.map(t => `<li>${t}${st ? ' · <span class="star">' + S.star + '</span>' : ''}</li>`).join('');
}

/* quiz: c = compare (answer index into > < =), m = which method */
const QZ = [
  { t: 'c', a: [5, 8], b: [3, 8], k: 0, why: { zh: '分母相同，5 份比 3 份多。', en: 'Same denominator; 5 parts beat 3 parts.' } },
  { t: 'c', a: [3, 5], b: [3, 8], k: 0, why: { zh: '分子相同，{1/5} 比 {1/8} 大。', en: 'Same numerator; {1/5} is bigger than {1/8}.' } },
  { t: 'c', a: [4, 9], b: [5, 8], k: 1, why: { zh: '{4/9} 不到一半，{5/8} 超过一半。', en: '{4/9} is less than half; {5/8} is more than half.' } },
  { t: 'c', a: [2, 3], b: [3, 4], k: 1, why: { zh: '通分：{8/12} &lt; {9/12}。', en: 'Common denominator: {8/12} &lt; {9/12}.' } },
  { t: 'c', a: [6, 8], b: [3, 4], k: 2, why: { zh: '{3/4} 上下都乘 2 就是 {6/8}，一样大。', en: '{3/4} × 2 on top and bottom is {6/8}. Equal.' } },
  { t: 'c', a: [7, 12], b: [5, 6], k: 1, why: { zh: '{5/6} = {10/12}，7 份比 10 份少。', en: '{5/6} = {10/12}; 7 parts are fewer than 10.' } },
  { t: 'm', a: [2, 7], b: [2, 9], k: 1, why: { zh: '分子都是 2；九分之一更小，所以 {2/7} &gt; {2/9}。', en: 'Both numerators are 2; ninths are smaller, so {2/7} &gt; {2/9}.' } },
  { t: 'm', a: [3, 7], b: [5, 9], k: 2, why: { zh: '7 的一半是 3.5，{3/7} 不到一半；9 的一半是 4.5，{5/9} 超过一半。所以 {3/7} &lt; {5/9}。', en: 'Half of 7 is 3.5, so {3/7} is under half; half of 9 is 4.5, so {5/9} is over half. {3/7} &lt; {5/9}.' } }
];
const done = new Map();
$('#quiz').innerHTML = QZ.map((x, i) => {
  const A = fr(...x.a), B = fr(...x.b);
  const q = x.t === 'c' ? `${A} <b>?</b> ${B}` : `${A} ${LANG === 'zh' ? '和' : 'and'} ${B}${LANG === 'zh' ? '：' : ': '}${S.mq}`;
  const ch = x.t === 'c' ? ['&gt;', '&lt;', '='] : S.mchoices;
  return `<div class="q" data-i="${i}"><p><b class="num">${i + 1}.</b> ${q}</p><div class="btns">${ch.map((c, j) => `<button data-j="${j}">${c}</button>`).join('')}</div><div class="fb" hidden></div></div>`;
}).join('');
$('#score').textContent = `0 / ${QZ.length}`;
$('#quiz').addEventListener('click', e => {
  const b = e.target.closest('button[data-j]'); if (!b) return;
  const box = b.closest('.q'), i = +box.dataset.i, x = QZ[i], ok = +b.dataset.j === x.k;
  if (!done.has(i)) done.set(i, ok);
  const fb = box.querySelector('.fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok ? `<b>${S.right}</b>${F(x.why[LANG])}` : `<b>${S.again}</b>${LANG === 'zh' ? '每一份一样大吗？份数一样多吗？' : 'Are the parts the same size? Same number of parts?'}`;
  const right = [...done.values()].filter(Boolean).length;
  $('#score').textContent = `${right} / ${QZ.length}`;
  if (right >= QZ.length - 1) { try { localStorage.setItem('star:' + ID, '1'); } catch (e) {} renderLog(); }
});

setPair(3, 5, 3, 8);
renderLog();
</script>
</body>
</html>
