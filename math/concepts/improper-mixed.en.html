    '<b>"{2 1/3} means 2 times {1/3}" ✗</b> A mixed number hides a <b>plus</b> sign: {2 1/3} = 2 + {1/3}.',
    '<b>"{4/4} is not an improper fraction" ✗</b> Equal to 1 counts as improper. {4/4} is exactly one whole.'
  ],
  quizEye: 'Quiz', quizH: 'Picture it, then count', score: 'Correct:', scoreRule: 'only your first try counts',
  askQ: 'Count first: how many full wholes? How many parts left over?', reveal: 'I counted, show me', empty: 'nothing yet',
  right: 'Right! ', again: 'Think again: ', hint: 'How many parts in one whole? How many wholes are full? How many parts are left?',
  sayEye: 'Say it in your own words',
  say: 'Take three identical cups; each one is "one whole". Pour water until the second cup is half full. How many cups is that? Tell Dad both ways (count in halves).',
  relEye: 'Related concepts',
  rel: ['<a href="comparing-fractions.en.html">Comparing fractions</a>: Lesson 2 of this chapter', 'Equivalent fractions (等值分数): Lesson 1. Example ④ uses it for {6/10} = {3/5} (page not made yet)', 'Converting improper fractions and mixed numbers: Lesson 5 (coming later)'],
  logEye: 'Learning log',
  log: ['2026-11-03 · 4A Chapter 6 Lesson 3 · Improper fractions and mixed numbers (counting parts)'],
  star: 'Quiz star earned ★',
  parentEye: 'For parents',
  parent: ['This lesson is about <b>counting</b>, not calculating. If your child says "{7/4} is 7 divided by 4", that is true and comes later; for now, steer back: "Let\'s count. How many parts fill one whole?"', 'Let your child press "+" part by part and <b>say out loud</b> "that fills one", then look at the number line.', 'Use real things: measuring cups, a ruler, a kitchen scale. For marks past 1, have your child say both names.'],
  foot: 'Words used at school: proper fraction 真分数 · improper fraction 假分数 · mixed number 带分数 · whole number 整数 · numerator 分子 · denominator 分母 · number line 数轴 · simplest form 最简形式 · one and two thirds 一又三分之二.'
}}[LANG];

const $ = s => document.querySelector(s);
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const mx = (w, n, d) => `<span class="mx"><span class="w">${w}</span>${fr(n, d)}</span>`;
const F = s => s.replace(/\{(?:(\d+) )?(\d+)\/(\d+)\}/g, (_, w, n, d) => w ? mx(w, n, d) : fr(n, d));

document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = F(S[e.dataset.t]));
$('#back').textContent = S.back;
$(LANG === 'zh' ? '#tozh' : '#toen').classList.add('on');
for (const a of ['#tozh', '#toen']) $(a).addEventListener('click', () => { try { localStorage.setItem('lang', a === '#tozh' ? 'zh' : 'en'); } catch (e) {} });
$('#kinds').innerHTML = S.kinds.map(([h, t, ex]) => `<div><h3>${h}</h3><p>${t}</p><p style="font-size:1.15rem">${F(ex)}</p></div>`).join('');

/* state: n parts of size 1/d, at most 4 wholes */
const DENS = [2, 3, 4, 5, 6, 8], MAXW = 4;
let d = 4, n = 5, view = 0, shown = false;
$('#dens').innerHTML = DENS.map(x => `<button data-d="${x}">${x}</button>`).join('');
$('#views').innerHTML = S.views.map((v, i) => `<button data-v="${i}">${v}</button>`).join('');
$('#dens').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; d = +b.dataset.d; n = Math.min(n, MAXW * d); shown = false; render(); });
$('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = +b.dataset.v; render(); });
$('#plus').addEventListener('click', () => { if (n < MAXW * d) { n++; shown = false; render(); } });
$('#minus').addEventListener('click', () => { if (n > 0) { n--; shown = false; render(); } });
$('#reveal').addEventListener('click', () => { shown = true; render(); });

const lab = (n, d) => `${n}/${d}`;
const mixLab = (n, d) => { const q = Math.floor(n / d), r = n % d; return !r ? `${q}` : q ? `${q} ${r}/${d}` : `${r}/${d}`; };

function drawBars(q) {
  const x0 = 50, W = 500, H = 40, gap = 14, w = W / d;
  let s = '';
  for (let row = 0; row < MAXW; row++) {
    const y = 8 + row * (H + gap), full = row < q;
    for (let i = 0; i < d; i++) {
      const k = row * d + i, cls = k < n ? (full ? 'pa' : 'pb') : 'pe';
      s += `<rect x="${x0 + i * w}" y="${y}" width="${w}" height="${H}" class="${cls}" stroke="var(--ink)" stroke-width="1" rx="2"/>`;
    }
    if (full) s += `<text x="${x0 + W + 12}" y="${y + 27}" style="fill:var(--a);font-weight:600;font-size:17px">1 ✓</text>`;
    else if (row === q && n % d) s += sFrac(x0 + W + 26, y + 20, n % d, d, 'var(--b)', 15);
  }
  return ['0 0 640 228', s];
}
function drawBeakers(q) {
  const bw = 110, bh = 150, top = 22, gap = 46, x0 = 22;
  let s = '';
  for (let i = 0; i < MAXW; i++) {
    const x = x0 + i * (bw + gap), amt = Math.max(0, Math.min(1, n / d - i)), full = i < q;
    if (amt > 0) s += `<rect x="${x}" y="${top + bh * (1 - amt)}" width="${bw}" height="${bh * amt}" class="${full ? 'pa' : 'pb'}" opacity=".85"/>`;
    for (let k = 1; k < d; k++) { const y = top + bh * (1 - k / d); s += `<line x1="${x}" y1="${y}" x2="${x + 26}" y2="${y}" class="tick"/>`; }
    s += `<path d="M${x} ${top - 8} V${top + bh} H${x + bw} V${top - 8}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    s += `<line x1="${x}" y1="${top}" x2="${x + bw}" y2="${top}" stroke="var(--ink)" stroke-dasharray="3 3"/>`;
    s += `<text x="${x + bw - 4}" y="${top - 6}" text-anchor="end" style="font-size:13px">1 L</text>`;
    if (full) s += `<text x="${x + bw / 2}" y="${top + bh + 22}" text-anchor="middle" style="fill:var(--a);font-weight:600;font-size:17px">1 ✓</text>`;
    else if (i === q && n % d) s += sFrac(x + bw / 2, top + bh + 14, n % d, d, 'var(--b)', 14);
  }
  return ['0 0 640 206', s];
}
/* stacked fraction in SVG, centred on x; mid = y of the fraction bar */
function sFrac(x, mid, nu, de, fill, fs) {
  const w = fs * 0.62 * Math.max(String(nu).length, String(de).length) + 4;
  return `<text x="${x}" y="${mid - 3}" text-anchor="middle" style="font-size:${fs}px;font-weight:600;fill:${fill}">${nu}</text>` +
    `<line x1="${x - w / 2}" y1="${mid}" x2="${x + w / 2}" y2="${mid}" stroke="${fill}" stroke-width="1.6"/>` +
    `<text x="${x}" y="${mid + fs - 1}" text-anchor="middle" style="font-size:${fs}px;font-weight:600;fill:${fill}">${de}</text>`;
}
/* whole number, or whole + stacked fraction side by side */
function sMixed(x, mid, n, d, fill, fs) {
  const q = Math.floor(n / d), r = n % d;
  if (!r) return `<text x="${x}" y="${mid + fs * 0.4}" text-anchor="middle" style="font-size:${fs + 3}px;font-weight:600;fill:${fill}">${q}</text>`;
  if (!q) return sFrac(x, mid, r, d, fill, fs);
  return `<text x="${x - 5}" y="${mid + fs * 0.4}" text-anchor="end" style="font-size:${fs + 4}px;font-weight:600;fill:${fill}">${q}</text>` + sFrac(x + 4, mid, r, d, fill, fs);
}
function drawLine() {
  /* show only as many wholes as needed, so ticks are wide enough to label (and readable on a phone) */
  const W = Math.max(2, Math.min(MAXW, Math.floor(n / d) + 1)), T = W * d;
  const lx = 34, LW = 572, y = 84, step = LW / T, pos = lx + step * n, all = T <= 12;
  let s = `<rect x="${lx}" y="8" width="${pos - lx}" height="10" rx="5" class="rope"/>`;
  s += `<line x1="${lx}" y1="${y}" x2="${lx + LW}" y2="${y}" class="tick"/>`;
  for (let i = 0; i <= T; i++) {
    const x = lx + step * i, big = i % d === 0;
    s += `<line x1="${x}" y1="${y - (big ? 11 : 7)}" x2="${x}" y2="${y + (big ? 11 : 7)}" class="tick"/>`;
    if (i === n) continue;
    const lab = big || (all && i < n);
    if (!lab) continue;
    if (i) s += sFrac(x, y - 36, i, d, 'var(--muted)', 18);
    s += big ? `<text x="${x}" y="${y + 44}" text-anchor="middle" style="font-size:22px;font-weight:600;fill:var(--ink)">${i / d}</text>` : sMixed(x, y + 36, i, d, 'var(--muted)', 18);
  }
  s += `<circle cx="${pos}" cy="${y}" r="8" style="fill:var(--both)"/>`;
  if (!shown && n) s += `<text x="${pos}" y="${y - 30}" text-anchor="middle" style="font-size:26px;font-weight:600;fill:var(--both)">?</text><text x="${pos}" y="${y + 46}" text-anchor="middle" style="font-size:26px;font-weight:600;fill:var(--both)">?</text>`;
  else { if (n) s += sFrac(pos, y - 36, n, d, 'var(--both)', 18); s += sMixed(pos, y + 36, n, d, 'var(--both)', 18); }
  return s;
}

function render() {
  const q = Math.floor(n / d), r = n % d;
  const [vb, pic] = view ? drawBeakers(q) : drawBars(q);
  $('#pic').setAttribute('viewBox', vb); $('#pic').innerHTML = pic; $('#pic').setAttribute('aria-label', `${n}/${d}`);
  $('#line').innerHTML = drawLine(); $('#line').setAttribute('aria-label', `${n}/${d} = ${mixLab(n, d)}`);

  const imp = n >= d;
  let res = `<span style="font-size:1.4rem">${fr(n, d)}</span>`;
  if (imp) res += ` = <span style="font-size:1.4rem">${r ? `<span class="mx"><span class="w ca">${q}</span><span class="cb">${fr(r, d)}</span></span>` : `<span class="num ca">${q}</span>`}</span>`;
  res += `<span class="kind">${imp ? S.kindI : S.kindP}${imp && !r ? ' · ' + S.whole : ''}</span>`;
  $('#result').innerHTML = res;

  /* the counting sentence: n/d = d/d + d/d + r/d = 1 + 1 + r/d */
  let c;
  if (!imp) c = `<p class="note">${S.smallNote(d)}</p>`;
  else {
    const parts = Array(q).fill(`<span class="ca">${fr(d, d)}</span>`), ones = Array(q).fill('<span class="ca num">1</span>');
    if (r) { parts.push(`<span class="cb">${fr(r, d)}</span>`); ones.push(`<span class="cb">${fr(r, d)}</span>`); }
    const end = r ? `<span class="mx"><span class="w ca">${q}</span><span class="cb">${fr(r, d)}</span></span>` : `<span class="num ca">${q}</span>`;
    c = `<p><b>${S.cntH}</b> ${fr(n, d)} = ${parts.join(' + ')} = ${ones.join(' + ')} = ${end}</p><p class="note">${S.cntNote(d)}</p>`;
  }
  if (!n) $('#result').innerHTML = `<span class="kind">${S.empty}</span>`;
  $('#count').innerHTML = c;
  const gate = !shown && n > 0;
  $('#ask').hidden = !gate; $('#result').hidden = gate; $('#count').hidden = gate || !c;

  document.querySelectorAll('#dens button').forEach(b => b.classList.toggle('on', +b.dataset.d === d));
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', +b.dataset.v === view));
  $('#cnt').textContent = n;
  $('#plus').disabled = n >= MAXW * d; $('#minus').disabled = n <= 0;
}
const PRE = [[5, 4], [3, 2], [8, 4], [7, 5], [11, 6], [2, 3]];
$('#presets').innerHTML = PRE.map((p, i) => `<button data-i="${i}">${fr(p[0], p[1])}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [n, d] = PRE[+b.dataset.i]; shown = false; render(); });

/* examples, mistakes, lists */
$('#steps').innerHTML = S.steps.map(([h, t]) => `<div class="step"><h3>${F(h)}</h3><p>${F(t)}</p></div>`).join('');
$('#errs').innerHTML = S.errs.map(t => `<p class="err">${F(t)}</p>`).join('');
$('#rel').innerHTML = S.rel.map(t => `<li>${F(t)}</li>`).join('');
$('#parent').innerHTML = S.parent.map(t => `<li>${F(t)}</li>`).join('');
function renderLog() {
  let st = false; try { st = !!localStorage.getItem('star:' + ID); } catch (e) {}
  $('#log').innerHTML = S.log.map(t => `<li>${t}${st ? ' · <span class="star">' + S.star + '</span>' : ''}</li>`).join('');
}

/* quiz: all solvable by counting; k = index of the right choice */
const QZ = [
  { q: { zh: '1 = ?', en: '1 = ?' }, ch: ['{1/5}', '{5/5}', '{10/5}'], k: 1,
    why: { zh: '一个整的分成 5 份，5 份全拿就是 1。', en: 'One whole cut into 5 parts; all 5 parts make 1.' } },
  { q: { zh: '2 = ? （用六分之一来数）', en: '2 = ? (count in sixths)' }, ch: ['{2/6}', '{12/6}', '{8/6}'], k: 1,
    why: { zh: '每个整的有 6 份，2 个整的是 6 + 6 = 12 份。', en: 'Each whole has 6 parts; 2 wholes are 6 + 6 = 12 parts.' } },
  { q: { zh: '{5/3} = {3/3} + {2/3} = ?', en: '{5/3} = {3/3} + {2/3} = ?' }, ch: ['{1 2/3}', '{2 2/3}', '{5 1/3}'], k: 0,
    why: { zh: '{3/3} 凑满 1 个整的，再加 {2/3}：{1 2/3}。', en: '{3/3} fills 1 whole, plus {2/3}: {1 2/3}.' } },
  { q: { zh: '下面哪个是假分数？', en: 'Which one is an improper fraction?' }, ch: ['{3/4}', '{5/5}', '{1 1/2}'], k: 1,
    why: { zh: '等于 1 也算假分数，{5/5} = 1。{1 1/2} 是带分数。', en: 'Equal to 1 counts as improper; {5/5} = 1. {1 1/2} is a mixed number.' } },
  { q: { zh: '哪个<b>不是</b>写好的带分数？', en: 'Which one is <b>not</b> a properly written mixed number?' }, ch: ['{2 1/4}', '{1 5/4}', '{3 2/3}'], k: 1,
    why: { zh: '{5/4} 已经满 1 了，带分数的分数部分要比 1 小。', en: '{5/4} is already more than 1; the fraction part must be less than 1.' } },
  { q: { zh: '数轴上，每两个整数之间分成 4 小格。从 0 出发，往右走 9 小格，到哪了？', en: 'On a number line, each whole is split into 4 equal parts. Start at 0 and move 9 parts to the right. Where are you?' }, ch: [{ zh: '{9/4}，也就是 {2 1/4}', en: '{9/4}, which is {2 1/4}' }, { zh: '{9/4}，也就是 {1 1/4}', en: '{9/4}, which is {1 1/4}' }, '{4/9}'], k: 0,
    why: { zh: '走 4 格到 1，走 8 格到 2，再走 1 格：{9/4}，也就是 {2 1/4}。', en: '4 parts reach 1, 8 parts reach 2, one more part: {9/4}, which is {2 1/4}.' } },
  { q: { zh: '4 + {2/9} = ?', en: '4 + {2/9} = ?' }, ch: ['{6/9}', '{4 2/9}', '{8/9}'], k: 1,
    why: { zh: '带分数就是「整数 + 分数」，直接写在一起：{4 2/9}。', en: 'A mixed number is whole + fraction, written together: {4 2/9}.' } },
  { q: { zh: '3 − {1/5} = ?', en: '3 − {1/5} = ?' }, ch: ['{3 1/5}', '{2 1/5}', '{2 4/5}'], k: 2,
    why: { zh: '3 拆成 2 和 1，1 = {5/5}，{5/5} − {1/5} = {4/5}，所以是 {2 4/5}。', en: 'Split 3 into 2 and 1; 1 = {5/5}; {5/5} − {1/5} = {4/5}. So {2 4/5}.' } }
];
const T = c => typeof c === 'string' ? c : c[LANG];
const done = new Map();
$('#quiz').innerHTML = QZ.map((x, i) => `<div class="q" data-i="${i}"><p><b class="num">${i + 1}.</b> ${F(x.q[LANG])}</p><div class="btns">${x.ch.map((c, j) => `<button data-j="${j}">${F(T(c))}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('');
$('#score').textContent = `0 / ${QZ.length}`;
$('#quiz').addEventListener('click', e => {
  const b = e.target.closest('button[data-j]'); if (!b) return;
  const box = b.closest('.q'), i = +box.dataset.i, x = QZ[i], ok = +b.dataset.j === x.k;
  if (!done.has(i)) done.set(i, ok);
  box.querySelectorAll('button').forEach(o => o.classList.remove('pickok', 'pickno')); b.classList.add(ok ? 'pickok' : 'pickno');
  const fb = box.querySelector('.fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok ? `<b>${S.right}</b>${F(x.why[LANG])}` : `<b>${S.again}</b>${S.hint}`;
  const right = [...done.values()].filter(Boolean).length;
  $('#score').textContent = `${right} / ${QZ.length}`;
  if (right >= QZ.length - 1) { try { localStorage.setItem('star:' + ID, '1'); } catch (e) {} renderLog(); }
});

render();
renderLog();
</script>
